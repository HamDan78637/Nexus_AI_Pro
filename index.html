<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus AI Pro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #07111f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 100vh;
      background: #0b1728;
      display: flex;
      flex-direction: column;
      border: 1px solid #1e3855;
    }

    header {
      padding: 18px 22px;
      background: #0e2035;
      border-bottom: 1px solid #1e3855;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff, #4da3ff);
      color: #07111f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }

    .title {
      font-size: 21px;
      font-weight: bold;
    }

    .status {
      color: #7fc8ff;
      font-size: 13px;
      margin-top: 4px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .message {
      max-width: 80%;
      padding: 13px 16px;
      margin-bottom: 15px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .bot {
      background: #142942;
      border: 1px solid #214364;
      margin-right: auto;
    }

    .user {
      background: #1769aa;
      margin-left: auto;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .welcome p {
      color: #b9c9da;
      line-height: 1.6;
    }

    .input-area {
      padding: 15px;
      background: #0e2035;
      border-top: 1px solid #1e3855;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #294966;
      background: #07111f;
      color: white;
      outline: none;
      font-size: 15px;
    }

    #sendButton {
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      background: #2488d8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    @media (max-width: 600px) {
      .app {
        height: 100vh;
        border: none;
      }

      #chat {
        padding: 16px;
      }

      .message {
        max-width: 90%;
      }

      .input-area {
        padding: 10px;
      }

      #sendButton {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">N</div>

      <div>
        <div class="title">Nexus_AI_Pro</div>
        <div class="status">● Smart AI Assistant</div>
      </div>
    </header>

    <main id="chat">

      <div class="welcome">
        <h2>👋 Welcome to Nexus_AI_Pro</h2>
        <p>
          Your fast, smart and reliable AI assistant.
          Ask questions, learn, code, write, research and solve problems.
        </p>
      </div>

      <div class="message bot">
        Hello! I'm Nexus_AI_Pro. 🚀

How can I help you today?
      </div>

    </main>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Ask Nexus_AI_Pro anything..."
        autocomplete="off"
      >

      <button id="sendButton">Send</button>
    </div>

  </div>

  <script>
    const WORKER_URL =
      "https://nexus-ai-pro.hamdansuhail17.workers.dev/";

    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const chat = document.getElementById("chat");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
      return message;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text || button.disabled) return;

      addMessage(text, "user");
      input.value = "";

      button.disabled = true;
      button.textContent = "Thinking...";

      const thinking = addMessage("Nexus_AI_Pro is thinking...", "bot");

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: text
          })
        });

        const data = await response.json();

        thinking.remove();

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        addMessage(data.response || "No response received.", "bot");

      } catch (error) {
        thinking.textContent =
          "Sorry, I couldn't connect to Nexus_AI_Pro right now. Please try again.";
        console.error(error);
      }

      button.disabled = false;
      button.textContent = "Send";
      input.focus();
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
